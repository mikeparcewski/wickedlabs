  <path d="M1440 250 V424" stroke-dasharray="6 10"/><circle cx="1440" cy="430" r="5"/>
  <path d="M212 540 V658" stroke-dasharray="6 10"/><circle cx="212" cy="664" r="5"/>
  <path d="M700 546 V658" stroke-dasharray="6 10"/><circle cx="700" cy="664" r="5"/>
  <path d="M1100 572 V670" stroke-dasharray="6 10"/><circle cx="1100" cy="676" r="5"/>
  <path d="M470 600 l9 10 l16 -22"/><path d="M820 620 l9 10 l16 -22"/><path d="M1250 330 l9 10 l16 -22"/>
