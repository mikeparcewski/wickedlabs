  <!-- a pin header and its lead, at the right edge -->
  <g transform="translate(1516 600)">
    <rect x="0" y="0" width="52" height="26" rx="4" stroke-width="1.8"/>
    <circle cx="10" cy="8" r="2.5"/><circle cx="20.7" cy="8" r="2.5"/><circle cx="31.3" cy="8" r="2.5"/><circle cx="42" cy="8" r="2.5"/>
