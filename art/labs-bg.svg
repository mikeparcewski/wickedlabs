    <rect x="16" y="18" width="52" height="30" rx="5"/><rect x="132" y="18" width="52" height="30" rx="5"/><rect x="74" y="74" width="52" height="30" rx="5"/>
    <path d="M68 33 H132 M42 48 V89 H74 M158 48 V89 H126"/>
