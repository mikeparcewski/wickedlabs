    <path d="M100 8 V112" stroke-dasharray="4 5"/>
    <rect x="60" y="18" width="80" height="14" rx="4"/><rect x="52" y="48" width="96" height="24" rx="5" stroke-width="1.8"/><rect x="60" y="88" width="80" height="14" rx="4"/>
    <path d="M140 25 H174 M148 60 H174 M140 95 H174"/><circle cx="178" cy="25" r="3"/><circle cx="178" cy="60" r="3"/><circle cx="178" cy="95" r="3"/>
